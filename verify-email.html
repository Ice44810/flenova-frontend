<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Flenova - Confirmation d'adresse</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-screen overflow-hidden text-gray-800 login-bg">
    <div class="h-full w-full flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-8 fade-in">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-4">
                    <i class="fa-solid fa-envelope-open-text text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Confirmation d'adresse</h2>
            </div>

            <div id="pending" class="text-center py-6">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-gray-400"></i>
                <p class="text-sm text-gray-500 mt-3">Vérification du lien...</p>
            </div>

            <div id="ok" class="hidden p-4 rounded-lg bg-green-50 border border-green-200">
                <p class="text-sm text-green-800"><i class="fa-solid fa-circle-check mr-2"></i><span id="ok-msg"></span></p>
                <a href="login.html" class="mt-3 inline-block text-sm font-medium text-blue-600 hover:text-blue-800">Se connecter</a>
            </div>

            <div id="ko" class="hidden p-4 rounded-lg bg-red-50 border border-red-200">
                <p class="text-sm text-red-800"><i class="fa-solid fa-triangle-exclamation mr-2"></i><span id="ko-msg"></span></p>
                <form id="resend-form" class="mt-4 space-y-2">
                    <label class="block text-xs font-medium text-red-900" for="resend-email">Recevoir un nouveau lien</label>
                    <input type="email" id="resend-email" required placeholder="vous@societe.fr" autocomplete="email"
                        class="block w-full border border-red-300 rounded-md py-2 px-3 text-sm focus:outline-none focus:ring-red-500 focus:border-red-500">
                    <button type="submit" class="w-full py-2 px-4 rounded-md text-sm font-medium text-white bg-red-600 hover:bg-red-700">
                        Renvoyer le lien
                    </button>
                </form>
                <p id="resend-done" class="hidden text-xs text-red-900 mt-3"></p>
            </div>

            <div class="mt-6 text-center">
                <a href="login.html" class="text-xs text-gray-400 hover:text-blue-600">Retour à la connexion</a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/security.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-toast.js"></script>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');

        function show(id) {
            for (const section of ['pending', 'ok', 'ko']) {
                document.getElementById(section).classList.toggle('hidden', section !== id);
            }
        }

        (async function confirmAddress() {
            if (!token) {
                document.getElementById('ko-msg').textContent = 'Lien incomplet ou invalide.';
                show('ko');
                return;
            }
            // Le jeton ne doit pas rester dans la barre d'adresse ni l'historique.
            history.replaceState(null, '', window.location.pathname);

            try {
                const response = await apiFetch('auth/verify-email', {
                    method: 'POST',
                    body: { token }
                });
                const result = await response.json().catch(() => ({}));

                if (response.ok && result.success) {
                    document.getElementById('ok-msg').textContent = result.message || 'Adresse confirmée.';
                    show('ok');
                } else {
                    document.getElementById('ko-msg').textContent =
                        result.message || result.error || 'Ce lien est invalide, expiré ou déjà utilisé.';
                    show('ko');
                }
            } catch (err) {
                document.getElementById('ko-msg').textContent = 'Impossible de contacter le serveur.';
                show('ko');
            }
        })();

        document.getElementById('resend-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;

            try {
                const email = document.getElementById('resend-email').value.trim();
                const response = await apiFetch('auth/resend-verification', {
                    method: 'POST',
                    body: { email }
                });
                const result = await response.json().catch(() => ({}));

                if (response.status === 429) {
                    showToast(result.error || 'Trop de demandes. Réessayez plus tard.', 'error');
                    return;
                }

                const done = document.getElementById('resend-done');
                done.textContent = result.message || 'Si cette adresse est en attente de confirmation, un nouveau lien vient d\'être envoyé.';
                done.classList.remove('hidden');
                e.target.classList.add('hidden');
            } catch (err) {
                showToast('Impossible de contacter le serveur', 'error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
