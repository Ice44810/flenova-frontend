<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Flenova - Connexion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive-touch.css">
</head>
<body class="h-screen overflow-hidden text-gray-800 login-bg">
    <div class="h-full w-full flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-8 fade-in">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-4">
                    <img src="assets/flenova_icon_512.jpg" class="w-8 h-8">
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Bienvenue sur Flenova</h2>
                <p class="text-sm text-gray-500">Connectez-vous pour gérer vos transports</p>
            </div>

            <div id="registered-notice" class="hidden mb-4 p-3 rounded-lg bg-green-50 border border-green-200">
                <p class="text-sm text-green-800">Compte créé. Connectez-vous pour démarrer votre essai Premium 30 jours.</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block bg-transparent text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="login-email" placeholder="Saisissez votre email" autocomplete="email"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 placeholder:text-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div>
                    <label class="block bg-transparent text-sm font-medium text-gray-700">Mot de passe</label>
                    <input type="password" id="login-password" placeholder="Saisissez votre mot de passe" autocomplete="current-password"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 placeholder:text-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <div id="login-turnstile" class="hidden flex justify-center"></div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Se connecter
                </button>
            </form>

            <div id="unverified-notice" class="hidden mt-4 p-4 rounded-lg bg-amber-50 border border-amber-200">
                <p class="text-sm text-amber-900"><i class="fa-solid fa-envelope mr-2"></i><span id="unverified-msg"></span></p>
                <button type="button" id="resend-verification"
                    class="mt-3 text-sm font-medium text-amber-900 underline hover:text-amber-700">
                    Renvoyer le lien de confirmation
                </button>
                <p id="resend-feedback" class="hidden text-xs text-amber-800 mt-2"></p>
            </div>

            <div class="mt-6 text-center space-y-3">
                <p class="text-sm">
                    <a href="forgot-password.html" class="text-blue-600 hover:text-blue-800 font-medium">Mot de passe oublié ?</a>
                </p>
                <p class="text-sm text-gray-500">
                    Pas encore de compte ?
                    <a href="register.html" class="text-blue-600 hover:text-blue-800 font-medium">Créer un essai gratuit</a>
                </p>
                <p class="text-xs text-gray-400">
                    <a href="/#contact" class="hover:text-blue-600">Contact</a>
                </p>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/security.js"></script>
    <script src="js/api.js"></script>
    <script src="js/turnstile-auth.js"></script>
    <script>
        initTurnstileWidget('login-turnstile');

        if (new URLSearchParams(window.location.search).get('registered') === '1') {
            document.getElementById('registered-notice')?.classList.remove('hidden');
        }
        const prefillEmail = new URLSearchParams(window.location.search).get('email');
        if (prefillEmail) {
            const emailInput = document.getElementById('login-email');
            if (emailInput) {
                emailInput.value = prefillEmail;
                document.getElementById('login-password')?.focus();
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast border-${type === 'success' ? 'green' : type === 'error' ? 'red' : 'blue'}-500`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            const icon = document.createElement('i');
            icon.className = `fa-solid ${icons[type] || icons.info} text-${type === 'success' ? 'green' : type === 'error' ? 'red' : 'blue'}-500 text-xl mr-3`;
            const span = document.createElement('span');
            span.className = 'text-sm text-gray-700';
            span.textContent = String(message || '');
            toast.appendChild(icon);
            toast.appendChild(span);
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Connexion...';

            try {
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const turnstile_token = typeof getTurnstileToken === 'function' ? getTurnstileToken() : undefined;
                const body = { email, password };
                if (turnstile_token) body.turnstile_token = turnstile_token;

                const response = await apiFetch('auth/login', {
                    method: 'POST',
                    body
                });

                const result = await response.json().catch(() => ({}));

                if (response.ok && result.success) {
                    setCurrentUser(result.user);
                    showToast('Bienvenue ' + result.user.name + ' !', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else if (result.code === 'EMAIL_NOT_VERIFIED') {
                    document.getElementById('unverified-msg').textContent =
                        result.message || 'Confirmez votre adresse e-mail avant de vous connecter.';
                    document.getElementById('unverified-notice').classList.remove('hidden');
                } else {
                    document.getElementById('unverified-notice').classList.add('hidden');
                    showToast(result.message || result.error || 'Identifiants incorrects', 'error');
                }
            } catch (err) {
                showToast('Impossible de contacter le serveur', 'error');
            } finally {
                if (typeof resetTurnstileWidget === 'function') resetTurnstileWidget();
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        document.getElementById('resend-verification').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            btn.disabled = true;

            try {
                const email = document.getElementById('login-email').value.trim();
                const response = await apiFetch('auth/resend-verification', {
                    method: 'POST',
                    body: { email }
                });
                const result = await response.json().catch(() => ({}));

                if (response.status === 429) {
                    showToast(result.error || 'Trop de demandes. Réessayez plus tard.', 'error');
                    return;
                }

                const feedback = document.getElementById('resend-feedback');
                feedback.textContent = result.message || 'Un nouveau lien vient d\'être envoyé.';
                feedback.classList.remove('hidden');
                btn.classList.add('hidden');
            } catch (err) {
                showToast('Impossible de contacter le serveur', 'error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
