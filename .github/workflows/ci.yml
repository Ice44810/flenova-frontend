name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: |
          npm ci
          npm run build:css
      - name: Verify tailwind output
        run: test -f css/tailwind.css
