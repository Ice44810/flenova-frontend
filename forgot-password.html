<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flenova - Mot de passe oublié</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-screen overflow-hidden text-gray-800 login-bg">
    <div class="h-full w-full flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-8 fade-in">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-4">
                    <i class="fa-solid fa-key text-xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Mot de passe oublié</h2>
                <p class="text-sm text-gray-500 mt-2">Saisissez votre adresse e-mail. Nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>
            </div>

            <form id="forgot-form" class="space-y-4">
                <div>
                    <label class="block bg-transparent text-sm font-medium text-gray-700" for="forgot-email">Adresse e-mail</label>
                    <input type="email" id="forgot-email" required placeholder="vous@societe.fr" autocomplete="email"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 placeholder:text-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Envoyer le lien
                </button>
            </form>

            <div id="forgot-done" class="hidden mt-6 p-4 rounded-lg bg-green-50 border border-green-200">
                <p class="text-sm text-green-800"><i class="fa-solid fa-envelope-circle-check mr-2"></i><span id="forgot-done-msg"></span></p>
                <p class="text-xs text-green-700 mt-2">Pensez à consulter votre dossier de courriers indésirables. Le lien est valable une heure.</p>
            </div>

            <div class="mt-6 text-center">
                <a href="login.html" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
                    <i class="fa-solid fa-arrow-left mr-1"></i>Retour à la connexion
                </a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/security.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth-toast.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Envoi...';

            try {
                const email = document.getElementById('forgot-email').value.trim();
                const response = await apiFetch('auth/forgot-password', {
                    method: 'POST',
                    body: { email }
                });
                const result = await response.json().catch(() => ({}));

                if (response.status === 429) {
                    showToast(result.error || 'Trop de demandes. Réessayez plus tard.', 'error');
                    return;
                }

                // La réponse est volontairement identique que le compte existe ou non :
                // l'interface ne peut donc pas confirmer l'existence d'une adresse.
                document.getElementById('forgot-done-msg').textContent =
                    result.message || 'Si un compte est associé à cette adresse, un lien vient d\'être envoyé.';
                document.getElementById('forgot-done').classList.remove('hidden');
                e.target.classList.add('hidden');
            } catch (err) {
                showToast('Impossible de contacter le serveur', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
