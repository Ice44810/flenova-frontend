<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfact - Inscription</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-screen overflow-hidden text-gray-800 login-bg">
    <div class="h-full w-full flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-8 fade-in">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 text-blue-600 mb-4">
                    <img src="assets/transfact_icon_512.jpg" class="w-8 h-8">
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Créer votre entreprise</h2>
                <p class="text-sm text-gray-500">1 mois d'essai <strong>Premium gratuit</strong> — toutes les fonctionnalités débloquées</p>
            </div>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nom de l'entreprise</label>
                    <input type="text" id="reg-company" required
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="Ma Société de Transport">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nom complet (Admin)</label>
                    <input type="text" id="reg-name" required
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="Jean Dupont">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="reg-email" required
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="admin@masociete.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Forfait souhaité après l'essai</label>
                    <select id="reg-plan" required
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <option value="independant">Indépendant — 99 €/mois HT</option>
                        <option value="pme">PME — 189 €/mois HT</option>
                        <option value="premium">Premium — 349 €/mois HT</option>
                    </select>
                    <p id="reg-plan-label" class="text-xs text-gray-500 mt-1">Essai Premium 30 jours offert, puis facturation par virement selon le forfait choisi.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mot de passe</label>
                    <input type="password" id="reg-password" required minlength="8"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="8 caractères minimum">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Confirmer le mot de passe</label>
                    <input type="password" id="reg-password-confirm" required
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                </div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Créer mon compte
                </button>
            </form>

            <div class="mt-6 text-center space-y-3">
                <p class="text-sm text-gray-500">
                    Déjà inscrit ?
                    <a href="login.html" class="text-blue-600 hover:text-blue-800 font-medium">Se connecter</a>
                </p>
                <p class="text-xs text-gray-400">
                    <a href="/#contact" class="hover:text-blue-600">Contact</a>
                </p>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
